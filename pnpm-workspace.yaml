packages:
  - "."
# Transitive native build (effect -> msgpackr -> msgpackr-extract). vref runs
# fine on the JS fallback, so skip the native compile.
allowBuilds:
  msgpackr-extract: false
# First-party packages are trusted (we publish them), so exempt the whole scope
# from the minimum-release-age policy that guards third-party publishes. A
# version-pinned entry does not work: lockfile verification ignores it and fails
# the install anyway, which is why this is scoped rather than enumerated.
minimumReleaseAgeExclude:
  - '@putdotio/*'
