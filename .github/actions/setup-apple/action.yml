name: Set up the Apple toolchain
description: Select Xcode, install the pinned toolchain, restore dependency and compilation caches, and provision brand fonts.
inputs:
  lane:
    description: Lane whose Xcode compilation cache to restore; omit when the job compiles nothing with Xcode.
    required: false
    default: ""
  simulator-template:
    description: Restore the cached iOS Simulator template for the harness to clone.
    required: false
    default: "false"
outputs:
  simulator-template-hit:
    description: Whether the iOS Simulator template came from the cache.
    value: ${{ steps.simulator-template.outputs.cache-hit }}
  simulator-template-key:
    description: Cache key the job saves a newly created template under.
    value: ${{ steps.simulator-template-key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Select Xcode 26.6
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: "26.6"

    - name: Install the pinned toolchain
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: "2026.9.15"

    - name: Restore pnpm store cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Restore SwiftPM repository cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-

    - name: Restore Tuist dependency cache
      id: tuist-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Tuist/.build
        key: ${{ runner.os }}-tuist-build-${{ hashFiles('mise.toml', 'Tuist/Package.swift', 'Tuist/Package.resolved', 'Packages/GoogleCastSDK/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-build-

    # An exact hit is what tuist install would produce, so generation skips it.
    - name: Skip tuist install on an exact cache hit
      if: steps.tuist-dependencies.outputs.cache-hit == 'true'
      shell: bash
      run: echo "PUTIO_TUIST_DEPENDENCIES_CACHED=1" >> "$GITHUB_ENV"

    # SwiftPM rebuilds a restored .build because checkout resets file times, so
    # the finished harness binary is cached instead, keyed on its sources.
    - name: Restore the harness binary
      id: harness-binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/putio-harness
        key: ${{ runner.os }}-${{ runner.arch }}-putio-harness-${{ hashFiles('Tools/PutioHarness/Package.swift', 'Tools/PutioHarness/Sources/**') }}

    - name: Build the harness binary
      if: steps.harness-binary.outputs.cache-hit != 'true'
      shell: bash
      run: |
        swift build --package-path Tools/PutioHarness --product putio-harness
        mkdir -p ~/.cache/putio-harness
        cp "$(swift build --package-path Tools/PutioHarness --show-bin-path)/putio-harness" ~/.cache/putio-harness/

    - name: Use the harness binary
      shell: bash
      run: echo "PUTIO_HARNESS_BINARY=$HOME/.cache/putio-harness/putio-harness" >> "$GITHUB_ENV"

    # Compilation cache entries are keyed by inputs and absolute paths, so they
    # survive fresh DerivedData on the fixed runner checkout path. Pushes to
    # next build on this ISO week's cache and save it; the first push of a week
    # builds cold, so stale entries stop accumulating. Pull requests restore the
    # latest cache and save none.
    - name: Enable Xcode compilation caching
      shell: bash
      run: |
        printf 'COMPILATION_CACHE_ENABLE_CACHING = YES\n' > "$RUNNER_TEMP/compilation-cache.xcconfig"
        printf 'XCODE_XCCONFIG_FILE=%s\n' "$RUNNER_TEMP/compilation-cache.xcconfig" >> "$GITHUB_ENV"
        printf 'PUTIO_CAS_WEEK=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_ENV"

    - name: Restore Xcode compilation cache
      if: inputs.lane != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/DerivedData/CompilationCache.noindex
        key: ${{ runner.os }}-xcode-cas-${{ inputs.lane }}-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-cas-${{ inputs.lane }}-${{ github.event_name == 'push' && format('{0}-', env.PUTIO_CAS_WEEK) || '' }}

    # A clone of an iOS Simulator that has already booted once skips first-boot
    # data migration, which takes one to several minutes on hosted runners. The
    # harness creates a missing template; the job saves it after a green run.
    - name: Key the iOS Simulator template
      id: simulator-template-key
      if: inputs.simulator-template == 'true'
      shell: bash
      run: echo "key=${{ runner.os }}-simulator-template-${ImageVersion:-unknown}-xcode-26.6" >> "$GITHUB_OUTPUT"

    - name: Restore the iOS Simulator template
      id: simulator-template
      if: inputs.simulator-template == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/putio-simulator-templates
        key: ${{ steps.simulator-template-key.outputs.key }}

    - name: Install the iOS Simulator template
      if: inputs.simulator-template == 'true'
      shell: bash
      run: |
        devices="$HOME/Library/Developer/CoreSimulator/Devices"
        if compgen -G "$HOME/.cache/putio-simulator-templates/*/" >/dev/null; then
          mkdir -p "$devices"
          mv "$HOME"/.cache/putio-simulator-templates/*/ "$devices/"
          # CoreSimulator only lists devices that existed when its service started.
          killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
        fi
        echo "PUTIO_SIMULATOR_TEMPLATES=1" >> "$GITHUB_ENV"

    # Once provisioned, a font-gated test that can't find a face fails instead of skipping.
    - name: Provision licensed brand fonts
      shell: bash
      run: |
        mise run fonts-setup
        echo "PUTIO_REQUIRE_BRAND_FONTS=1" >> "$GITHUB_ENV"
