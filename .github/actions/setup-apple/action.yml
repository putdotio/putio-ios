name: Set up the Apple toolchain
description: Select Xcode, install the pinned toolchain, restore dependency and compilation caches, and provision brand fonts.
inputs:
  lane:
    description: Lane whose Xcode compilation cache to restore; omit when the job compiles nothing with Xcode.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Select Xcode 26.6
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: "26.6"

    - name: Install the pinned toolchain
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: "2026.9.15"

    - name: Restore pnpm store cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Restore SwiftPM repository cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-

    - name: Restore Tuist dependency cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Tuist/.build
        key: ${{ runner.os }}-tuist-build-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', 'Packages/GoogleCastSDK/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-build-

    # Compilation cache entries are keyed by inputs and absolute paths, so they
    # survive fresh DerivedData on the fixed runner checkout path. Pushes to
    # next build cold and save; pull requests only restore, so the cache never
    # accumulates stale entries.
    - name: Enable Xcode compilation caching
      shell: bash
      run: |
        printf 'COMPILATION_CACHE_ENABLE_CACHING = YES\n' > "$RUNNER_TEMP/compilation-cache.xcconfig"
        printf 'XCODE_XCCONFIG_FILE=%s\n' "$RUNNER_TEMP/compilation-cache.xcconfig" >> "$GITHUB_ENV"

    - name: Restore Xcode compilation cache
      if: github.event_name != 'push' && inputs.lane != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/DerivedData/CompilationCache.noindex
        key: ${{ runner.os }}-xcode-cas-${{ inputs.lane }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-xcode-cas-${{ inputs.lane }}-

    # Once provisioned, a font-gated test that can't find a face fails instead of skipping.
    - name: Provision licensed brand fonts
      shell: bash
      run: |
        mise run fonts-setup
        echo "PUTIO_REQUIRE_BRAND_FONTS=1" >> "$GITHUB_ENV"
