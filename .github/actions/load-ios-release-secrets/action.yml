name: Load iOS release secrets
description: Validate iOS release environment secrets and export the archive's build settings

runs:
  using: composite
  steps:
    - name: Require release environment secrets
      shell: bash
      run: |
        required=(
          APPSTORE_CONNECT_ISSUER_ID
          APPSTORE_CONNECT_KEY_ID
          APPSTORE_CONNECT_KEY_CONTENT
          PUTIO_APP_IDENTIFIER
          PUTIO_DEVELOPMENT_TEAM
          PUTIO_OAUTH_CLIENT_ID
          PUTIO_CHROMECAST_RECEIVER_APP_ID
          PUTIO_INTERCOM_API_KEY
          PUTIO_INTERCOM_APP_ID
          PUTIO_SENTRY_DSN
        )

        missing=()
        for name in "${required[@]}"; do
          if [ -z "${!name:-}" ]; then
            missing+=("$name")
          fi
        done

        if (( ${#missing[@]} > 0 )); then
          printf 'Missing release Environment secrets: %s\n' "${missing[*]}" >&2
          exit 1
        fi

        # Release builds report to Sentry project ios while the account allows
        # it (#161), so one without that project's DSN must not ship.
        if [[ ! "$PUTIO_SENTRY_DSN" =~ ^https://[[:alnum:]]+@[[:alnum:].-]+/5282170$ ]]; then
          echo "PUTIO_SENTRY_DSN must be a DSN for Sentry project 5282170" >&2
          exit 1
        fi

        # Contact us and destroy-account support open Intercom (#318). "null" is
        # the SOPS payload's not-configured marker (secrets-render.jq), not a key.
        for name in PUTIO_INTERCOM_API_KEY PUTIO_INTERCOM_APP_ID; do
          if [[ "${!name}" == null || ! "${!name}" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "$name must be one or more of A-Z a-z 0-9 . _ : - and not null" >&2
            exit 1
          fi
        done

    - name: Export build settings for the archive
      shell: bash
      run: |
        persist_env() {
          local name="$1"
          local delimiter
          delimiter="PUTIO_ENV_$(uuidgen | tr -d '-')"

          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "${!name:-}"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
        }

        downstream_variables=(
          PUTIO_APP_IDENTIFIER
          PUTIO_DEVELOPMENT_TEAM
          PUTIO_OAUTH_CLIENT_ID
          PUTIO_CHROMECAST_RECEIVER_APP_ID
          PUTIO_INTERCOM_API_KEY
          PUTIO_INTERCOM_APP_ID
          PUTIO_SENTRY_DSN
        )

        for name in "${downstream_variables[@]}"; do
          persist_env "$name"
        done
