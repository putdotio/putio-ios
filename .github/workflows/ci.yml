name: CI

on:
  pull_request:
    paths-ignore: &docs_only_ignore
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'fastlane/README.md'
  push:
    branches:
      - main
    paths-ignore: *docs_only_ignore

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1
        with:
          ruby-version: mise.toml
          bundler-cache: true

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: make bootstrap-ci

      # Visual baselines are recorded with the brand faces bundled, so verify
      # needs them too or every snapshot assertion fails on typography. The
      # fonts come from static.put.io and need no credentials, so this works
      # identically for forks and Dependabot.
      - name: Sync licensed brand fonts
        run: |
          make fonts-setup
          make fonts-check

      - name: Verify repository
        run: make verify

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-xcresult
          path: build/verify.xcresult
          if-no-files-found: ignore
