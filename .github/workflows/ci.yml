name: CI

# No paths-ignore: the workflow always triggers and each job decides for itself
# whether the diff can affect it. Filtering at the `on:` level would stop the
# workflow entirely, so no check would ever report — harmless while nothing is
# required, and a silent hole the day something is.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  changes:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.classify.outputs.app }}
      tooling: ${{ steps.classify.outputs.tooling }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The file list comes from the API rather than git, so this needs no
      # history: a pull request compares against its own base, and a push to
      # main compares the range it pushed. A branch with no previous commit has
      # no usable range, so every lane runs.
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One line per changed file, carrying previous_filename beside
          # filename: a rename reports only where the file landed, so moving an
          # app file into an ignored path would otherwise read as a docs-only
          # diff while deleting app code. Keeping the pair on one line means the
          # cap below counts files rather than emitted paths.
          if [ "$EVENT" = "pull_request" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | [.filename, (.previous_filename // empty)] | @tsv' > files.tsv
          elif [ -n "${BEFORE//0/}" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
              --jq '.files[] | [.filename, (.previous_filename // empty)] | @tsv' > files.tsv

            # The compare endpoint returns at most 300 files and does not
            # paginate past them, so a larger push arrives silently truncated.
            if [ "$(wc -l < files.tsv)" -ge 300 ]; then
              echo "the compare response is at its 300-file cap and may be truncated; running every lane" >&2
              printf 'app=true\ntooling=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "no comparable range for $EVENT; running every lane" >&2
            printf 'app=true\ntooling=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tr '\t' '\n' < files.tsv | grep -v '^$' > changed.txt

          echo "changed paths:"
          sed 's/^/  /' changed.txt
          ./scripts/ci-affected.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  verify-app:
    name: Verify iOS app
    needs: changes
    # Fails closed. A classifier that errored publishes no outputs, and a job
    # skipped for that reason still reports a green check — so anything other
    # than a clean classification runs the lane.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27"

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: mise.toml

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: false

      - name: Install Swift packages and SwiftLint
        run: mise run bootstrap-ci

      # Visual baselines are recorded with the brand faces bundled, so verify
      # needs them too or every snapshot assertion fails on typography. The
      # fonts come from static.put.io and need no credentials, so this works
      # identically for forks and Dependabot.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Verify repository
        run: mise run verify

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-xcresult
          path: build/verify.xcresult
          if-no-files-found: ignore

  # Linux, because nothing here needs Xcode and macOS minutes bill at 10x. This
  # is also where verify-scripts-types first runs in CI at all: it is kept out of
  # verify-fast so that gate needs no Node, which left it running nowhere.
  verify-tooling:
    name: Verify repo tooling
    needs: changes
    # Fails closed for the same reason as verify-app above.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tooling == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Before any asc command: asc 5.15.0 sends command telemetry unless this is set.
      ASC_TELEMETRY_DISABLED: "1"
      ASC_SKILLS_AUTO_CHECK: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: false

      # Named explicitly so mise installs Node and nothing else: its Ruby would
      # compile from source, so ruby/setup-ruby below provides the prebuilt one.
      - name: Install the pinned Node
        run: |
          mise install node
          mise exec -- corepack enable pnpm

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      # The signing profile check is Ruby, so its tests need the pinned one.
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: mise.toml

      - name: Type-check repo tooling
        run: mise run verify-scripts-types

      - name: Install the pinned asc
        run: |
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      # Fails if telemetry were off for any reason but the variable.
      - name: Prove asc telemetry is off
        run: |
          asc telemetry status --output json | jq -e '.enabled == false and .reason == "ASC_TELEMETRY_DISABLED"'
          env -u ASC_TELEMETRY_DISABLED asc telemetry status --output json | jq -e '.enabled == true'

      - name: Test repo tooling
        env:
          PUTIO_REQUIRE_ASC: "1"
        run: mise run verify-scripts-tests

      # Offline: metadata limits, What's New, and screenshot sizes, as asc
      # would reject them at upload.
      - name: Check the App Store listing
        run: mise exec -- node scripts/app-store.ts check

      # No browser: this hashes the committed baselines and configs rather than
      # re-rendering, so a stale marketing image fails by name here instead of
      # reaching the App Store.
      - name: Check the marketing images against their inputs
        run: mise run verify-store-images
