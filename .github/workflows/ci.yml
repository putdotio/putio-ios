name: CI

# No paths-ignore: the workflow always triggers and each job decides for itself
# whether the diff can affect it. Filtering at the `on:` level would stop the
# workflow entirely, so no check would ever report — harmless while nothing is
# required, and a silent hole the day something is.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  changes:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.classify.outputs.app }}
      tooling: ${{ steps.classify.outputs.tooling }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The file list comes from the API rather than git, so this needs no
      # history: a pull request compares against its own base, and a push to
      # main compares the range it pushed. A branch with no previous commit has
      # no usable range, so every lane runs.
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[].filename' > changed.txt
          elif [ -n "${BEFORE//0/}" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
              --jq '.files[].filename' > changed.txt
          else
            echo "no comparable range for $EVENT; running every lane" >&2
            printf 'app=true\ntooling=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed paths:"
          sed 's/^/  /' changed.txt
          ./scripts/ci-affected.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  verify-app:
    name: Verify iOS app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1
        with:
          ruby-version: mise.toml
          bundler-cache: true

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: mise run bootstrap-ci

      # Visual baselines are recorded with the brand faces bundled, so verify
      # needs them too or every snapshot assertion fails on typography. The
      # fonts come from static.put.io and need no credentials, so this works
      # identically for forks and Dependabot.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run fonts-check

      - name: Verify repository
        run: mise run verify

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-xcresult
          path: build/verify.xcresult
          if-no-files-found: ignore

  # Linux, because nothing here needs Xcode and macOS minutes bill at 10x. This
  # is also where scripts-typecheck first runs in CI at all: it is kept out of
  # verify-fast so that gate needs no Node, which left it running nowhere.
  verify-tooling:
    name: Verify repo tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      # Named explicitly so mise installs Node and nothing else: its Ruby comes
      # from source, and this lane runs no Ruby task.
      - name: Install the pinned Node
        run: |
          mise install node
          mise exec -- corepack enable pnpm

      - name: Install Node dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Type-check repo tooling
        run: mise run scripts-typecheck
