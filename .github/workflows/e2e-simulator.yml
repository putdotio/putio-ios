name: E2E Simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
  schedule:
    # Weekly run against main, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-simulator-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Each job installs the tools it needs by name; mise run must not fetch the rest.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  e2e-simulator:
    name: Run mocked simulator e2e
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27"

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Install Swift packages and SwiftLint
        run: mise run bootstrap-ci

      # The walk asserts committed baselines recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less run fails every screen. The fonts come from static.put.io and
      # need no credentials.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Run mocked simulator e2e
        run: mise run e2e-simulator

      - name: Assert the screenshot walk
        if: ${{ !cancelled() }}
        run: mise run screenshots-verify

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-simulator-xcresult
          path: |
            build/e2e-simulator.xcresult
            build/screenshots-verify.xcresult
          if-no-files-found: ignore
