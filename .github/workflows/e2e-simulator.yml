name: E2E Simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
  schedule:
    # Weekly run against main, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-simulator-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Each job installs the tools it needs by name; mise run must not fetch the rest.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  simulator:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run mocked e2e playback and previews
            artifact: e2e-playback-xcresult
            task: e2e-simulator
            args: --only-testing PutioUITests/PlaybackSmokeUITests --only-testing PutioUITests/FilePreviewUITests --only-testing PutioUITests/HistorySmokeUITests --only-testing PutioUITests/ClearDataUITests
            bundle: build/e2e-simulator.xcresult
          - name: Run mocked e2e for everything else
            artifact: e2e-rest-xcresult
            task: e2e-simulator
            args: --skip-testing PutioUITests/PlaybackSmokeUITests --skip-testing PutioUITests/FilePreviewUITests --skip-testing PutioUITests/HistorySmokeUITests --skip-testing PutioUITests/ClearDataUITests
            bundle: build/e2e-simulator.xcresult
          - name: Assert the screenshot walk
            artifact: screenshots-verify-xcresult
            task: screenshots-verify
            args: ''
            bundle: build/screenshots-verify.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27"

      - name: Restore Swift packages and compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Developer/Xcode/DerivedData/Putio-*/SourcePackages
          key: verify-app-xcode27-${{ hashFiles('Putio.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: verify-app-xcode27-${{ hashFiles('Putio.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Install Swift packages and SwiftLint
        run: mise run bootstrap-ci

      # The walk asserts committed baselines recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less run fails every screen. The fonts come from static.put.io and
      # need no credentials.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: ${{ matrix.name }}
        run: mise run ${{ matrix.task }} -- ${{ matrix.args }}

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: ignore

  report-failure:
    name: Report failure
    needs: simulator
    if: ${{ always() && (needs.simulator.result == 'failure' || needs.simulator.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: E2E Simulator is failing
          RESULT: ${{ needs.simulator.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          body="[$EVENT run on \`$REF\`]($RUN_URL): $RESULT."
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
