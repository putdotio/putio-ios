name: E2E Simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
  schedule:
    # Weekly run against main, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-simulator-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  e2e-simulator:
    name: Run mocked simulator e2e
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27"

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: mise.toml
          bundler-cache: true

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods, Swift packages and SwiftLint
        run: mise run bootstrap-ci

      # The walk asserts committed baselines recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less run fails every screen. The fonts come from static.put.io and
      # need no credentials.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Run mocked simulator e2e
        run: mise run e2e-simulator

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-simulator-xcresult
          path: build/e2e-simulator.xcresult
          if-no-files-found: ignore
