name: E2E Simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
  schedule:
    # Weekly run against main, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-simulator-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  e2e-simulator:
    name: Run mocked simulator e2e
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1
        with:
          ruby-version: mise.toml
          bundler-cache: true

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: mise run bootstrap-ci

      # The walk asserts committed baselines recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less run fails every screen. The fonts come from static.put.io and
      # need no credentials.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Run mocked simulator e2e
        run: mise run e2e-simulator

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-simulator-xcresult
          path: build/e2e-simulator.xcresult
          if-no-files-found: ignore
