name: Release

# Dispatch-only: builds the exact validated protected-main commit, and tags it
# v<version> only after App Store Connect accepted the upload.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit SHA to build
        required: true
        type: string
      version:
        description: App Store version to build, for example 3.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-${{ inputs.version }}
  cancel-in-progress: false

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"
  # Before any asc command: asc 5.15.0 sends command telemetry unless this is set.
  ASC_TELEMETRY_DISABLED: "1"
  ASC_SKILLS_AUTO_CHECK: "0"

# Explicit bash runs with -o pipefail, so asc failing in front of tee fails
# the step; GitHub's default shell does not.
defaults:
  run:
    shell: bash

jobs:
  validate-ref:
    name: Validate protected main
    uses: ./.github/workflows/delivery-ref.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}

  release:
    name: Build and upload the App Store build
    needs: validate-ref
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.metadata.outputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false

      # First: a version without What's New can't be submitted, so it must not
      # cost a macOS verify and archive to find out.
      - name: Prepare release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be three period-separated integers, for example 3.0.1" >&2
            exit 1
          fi
          whats_new="metadata/version/$RELEASE_VERSION/en-US.json"
          if ! jq -e '.whatsNew | type == "string" and length > 0' "$whats_new" > /dev/null; then
            echo "$whats_new needs a whatsNew before $RELEASE_VERSION can ship" >&2
            exit 1
          fi
          build_number="$(date -u +%y%m%d%H%M)"
          {
            echo "PUTIO_RELEASE_VERSION=$RELEASE_VERSION"
            echo "PUTIO_RELEASE_BUILD_NUMBER=$build_number"
            echo "PUTIO_RELEASE_IPA_PATH=$RUNNER_TEMP/putio-ios-release.ipa"
          } >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: mise.toml
          bundler-cache: false

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: mise run bootstrap-ci

      # Must precede `mise run verify`: baselines are recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less verify fails every snapshot assertion. The archive step later
      # bundles whatever this sync fetched. The fonts come from static.put.io
      # and need no credentials; the sync fails loudly on a bad download or a
      # checksum mismatch, so a system-font build can never ship silently.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Verify repository
        run: mise run verify

      - name: Load shared release secrets
        uses: ./.github/actions/load-ios-release-secrets
        env:
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          PUTIO_APP_IDENTIFIER: ${{ secrets.PUTIO_APP_IDENTIFIER }}
          PUTIO_DEVELOPMENT_TEAM: ${{ secrets.PUTIO_DEVELOPMENT_TEAM }}
          PUTIO_OAUTH_CLIENT_ID: ${{ secrets.PUTIO_OAUTH_CLIENT_ID }}
          PUTIO_CHROMECAST_RECEIVER_APP_ID: ${{ secrets.PUTIO_CHROMECAST_RECEIVER_APP_ID }}
          PUTIO_INTERCOM_API_KEY: ${{ secrets.PUTIO_INTERCOM_API_KEY }}
          PUTIO_INTERCOM_APP_ID: ${{ secrets.PUTIO_INTERCOM_APP_ID }}
          PUTIO_SENTRY_DSN: ${{ secrets.PUTIO_SENTRY_DSN }}

      - name: Install the pinned asc
        run: |
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      - name: Install the App Store distribution identity
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          asc telemetry status --output json | jq -e '.enabled == false' > /dev/null
          ./scripts/install-signing.sh

      - name: Archive and export the App Store ipa
        env:
          PUTIO_APP_DISPLAY_NAME: put.io
          PUTIO_PRIMARY_APP_ICON: AppIcon
        run: ./scripts/archive-ios.sh "$PUTIO_RELEASE_VERSION" "$PUTIO_RELEASE_BUILD_NUMBER" "$PUTIO_RELEASE_IPA_PATH"

      # Uploads, waits for processing, creates or finds the version and
      # attaches the build. Never submits: that is the Submit workflow.
      - name: Upload and attach the build
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          asc telemetry status --output json | jq -e '.enabled == false' > /dev/null
          asc publish appstore --app 1260479699 --platform IOS --ipa "$PUTIO_RELEASE_IPA_PATH" \
            --version "$PUTIO_RELEASE_VERSION" --wait --timeout 60m --output markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the signing keychain
        if: always() && env.PUTIO_SIGNING_KEYCHAIN != ''
        run: |
          [ ! -e "$PUTIO_SIGNING_KEYCHAIN" ] || asc signing keychain delete --keychain "$PUTIO_SIGNING_KEYCHAIN" --confirm --output json > /dev/null

  listing:
    name: Apply the listing and validate
    needs: [validate-ref, release]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Install the pinned Node and asc
        run: |
          mise install node
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      - name: Apply metadata, release type, phased release and age rating
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
          APP_REVIEW_DEMO_ACCOUNT_NAME: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_NAME }}
          APP_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_PASSWORD }}
        run: mise exec -- node scripts/app-store.ts apply --version "$RELEASE_VERSION" --confirm

      - name: Validate submission readiness
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts validate --version "$RELEASE_VERSION"

  # The v* tag ruleset lets only the putio-ci App create tags. This job holds
  # nothing but that App's key, mints a token for this repository with
  # contents:write alone, and checks out nothing.
  tag:
    name: Tag the uploaded commit
    needs: [validate-ref, release]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5

    steps:
      - name: Mint a putio-ci token for tagging
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUTIO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Annotated, so the tag records which upload is the release build. Submit
      # refuses a build number the tag does not name.
      - name: Create v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SHA: ${{ needs.validate-ref.outputs.sha }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null || true)"
          if [ -n "$ref" ]; then
            if [ "$(jq -r .object.type <<< "$ref")" != tag ]; then
              echo "$tag already exists without a build number" >&2
              exit 1
            fi
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<< "$ref")")"
            if [ "$(jq -r .object.sha <<< "$existing")" != "$SHA" ]; then
              echo "$tag already points at $(jq -r .object.sha <<< "$existing"), not $SHA" >&2
              exit 1
            fi
            if ! jq -r .message <<< "$existing" | grep -xF "Build-Number: $BUILD_NUMBER" > /dev/null; then
              echo "$tag already records another build; submit that one" >&2
              exit 1
            fi
          else
            object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f object="$SHA" -f type=commit \
              -f message="$(printf 'put.io %s\n\nBuild-Number: %s' "$RELEASE_VERSION" "$BUILD_NUMBER")" | jq -r .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          fi
          echo "- Tagged \`$tag\` at \`$SHA\` (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
