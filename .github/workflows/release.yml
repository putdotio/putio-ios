name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit SHA to build
        required: true
        type: string
      version:
        description: Release version to build and upload from main
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || 'main' }}
  cancel-in-progress: false

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  validate-ref:
    name: Validate protected legacy release source
    uses: ./.github/workflows/legacy-delivery-ref.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      allow_release_tag: ${{ github.event_name == 'release' }}

  release:
    name: Build release artifact
    needs: validate-ref
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_PLUGINS_TABLE: '1'
      FASTLANE_SKIP_ACTION_SUMMARY: '1'
      FASTLANE_SKIP_ALL_LANE_SUMMARIES: '1'
      FASTLANE_HIDE_TIMESTAMP: '1'
      FASTLANE_DISABLE_COLORS: '1'
      FASTLANE_SKIP_DOCS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: mise.toml
          bundler-cache: false

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: mise run bootstrap-ci

      # Must precede `mise run verify`: baselines are recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less verify fails every snapshot assertion. The archive step later
      # bundles whatever this sync fetched. The fonts come from static.put.io
      # and need no credentials; the sync fails loudly on a bad download or a
      # checksum mismatch, so a system-font build can never ship silently.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Verify repository
        run: mise run verify

      - name: Prepare release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in
              v*) release_version="${RELEASE_TAG#v}" ;;
              *)
                echo "Release tags must start with v" >&2
                exit 1
                ;;
            esac
          else
            release_version="$RELEASE_VERSION_INPUT"
          fi

          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be three period-separated integers, for example 1.2.3" >&2
            exit 1
          fi

          echo "PUTIO_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Load shared release secrets
        uses: ./.github/actions/load-ios-release-secrets
        env:
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          PUTIO_APP_IDENTIFIER: ${{ secrets.PUTIO_APP_IDENTIFIER }}
          PUTIO_APPLE_ID: ${{ secrets.PUTIO_APPLE_ID }}
          PUTIO_ITC_TEAM_ID: ${{ secrets.PUTIO_ITC_TEAM_ID }}
          PUTIO_DEVELOPMENT_TEAM: ${{ secrets.PUTIO_DEVELOPMENT_TEAM }}
          PUTIO_OAUTH_CLIENT_ID: ${{ secrets.PUTIO_OAUTH_CLIENT_ID }}
          PUTIO_CHROMECAST_RECEIVER_APP_ID: ${{ secrets.PUTIO_CHROMECAST_RECEIVER_APP_ID }}
          PUTIO_INTERCOM_API_KEY: ${{ secrets.PUTIO_INTERCOM_API_KEY }}
          PUTIO_INTERCOM_APP_ID: ${{ secrets.PUTIO_INTERCOM_APP_ID }}
          PUTIO_SENTRY_DSN: ${{ secrets.PUTIO_SENTRY_DSN }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_TYPE: ${{ secrets.MATCH_TYPE }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY_CONTENT: ${{ secrets.MATCH_GIT_PRIVATE_KEY_CONTENT }}

      - name: Build and upload release artifact
        env:
          PUTIO_APP_DISPLAY_NAME: put.io
          PUTIO_PRIMARY_APP_ICON: AppIcon
        run: |
          bundle exec fastlane release
