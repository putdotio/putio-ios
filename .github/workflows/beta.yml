name: Beta

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit SHA to build
        required: true
        type: string
      groups:
        description: Comma-separated TestFlight groups
        required: false
        default: Beta
      processing_timeout_minutes:
        description: Minutes to wait for App Store Connect processing before failing
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: beta-main
  cancel-in-progress: false

# mise must never install a tool here: it would compile Ruby from source.
# ruby/setup-ruby provides the prebuilt one each job runs against.
env:
  MISE_AUTO_INSTALL: "false"
  # Before any asc command: asc 5.15.0 sends command telemetry unless this is set.
  ASC_TELEMETRY_DISABLED: "1"
  ASC_SKILLS_AUTO_CHECK: "0"

# Explicit bash runs with -o pipefail, so asc failing in front of tee fails
# the step; GitHub's default shell does not.
defaults:
  run:
    shell: bash

jobs:
  validate-ref:
    name: Validate protected main
    uses: ./.github/workflows/delivery-ref.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}

  beta:
    name: Upload beta build
    needs: validate-ref
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          # Full history, so beta-notes finds the latest release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: mise.toml
          bundler-cache: false

      # Task runner only. install: false and MISE_AUTO_INSTALL keep mise from
      # building its own Ruby from source; the prebuilt one above is what tasks
      # run against.
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-${{ github.workflow }}-

      - name: Install CocoaPods dependencies
        run: mise run bootstrap-ci

      # Must precede `mise run verify`: baselines are recorded with the brand faces
      # bundled (PUTIO_BUNDLE_BRAND_FONTS=YES in Verify.xcconfig), so a
      # font-less verify fails every snapshot assertion. The archive step later
      # bundles whatever this sync fetched. The fonts come from static.put.io
      # and need no credentials; the sync fails loudly on a bad download or a
      # checksum mismatch, so a system-font build can never ship silently.
      - name: Sync licensed brand fonts
        run: |
          mise run fonts-setup
          mise run verify-fonts

      - name: Verify repository
        run: mise run verify

      # Notes cover everything since the latest v* tag, which Release creates
      # at upload; betas are not tagged. Any Claude failure gives the fallback note.
      - name: Write tester notes
        id: notes
        uses: putdotio/.github/.github/actions/beta-notes@32b9f2f9ac2b6b17b2be6b111ec495e079384b4c # v2.3.1
        with:
          app: put.io for iPhone and iPad
          tag-pattern: v*

      - name: Prepare beta metadata
        shell: bash
        env:
          PUTIO_BETA_GROUPS: ${{ inputs.groups }}
          PROCESSING_TIMEOUT_MINUTES: ${{ inputs.processing_timeout_minutes }}
          PUTIO_APP_DISPLAY_NAME: put.io
          PUTIO_PRIMARY_APP_ICON: AppIconNightly
        run: |
          if ! [[ "$PROCESSING_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "processing_timeout_minutes must be an integer number of minutes" >&2
            exit 1
          fi

          if [ "$PROCESSING_TIMEOUT_MINUTES" -lt 1 ] || [ "$PROCESSING_TIMEOUT_MINUTES" -gt 120 ]; then
            echo "processing_timeout_minutes must be between 1 and 120" >&2
            exit 1
          fi

          if [[ "$PUTIO_BETA_GROUPS" == *$'\n'* || "$PUTIO_BETA_GROUPS" == *$'\r'* ]]; then
            echo "groups must be a single-line comma-separated value" >&2
            exit 1
          fi

          PUTIO_BETA_BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          PUTIO_BETA_IPA_PATH="$RUNNER_TEMP/putio-ios-beta.ipa"
          PUTIO_BETA_WAIT_TIMEOUT_DURATION="$(( PROCESSING_TIMEOUT_MINUTES * 60 ))"
          export PUTIO_BETA_BUILD_NUMBER
          export PUTIO_BETA_IPA_PATH
          export PUTIO_BETA_WAIT_TIMEOUT_DURATION

          {
            echo "PUTIO_BETA_BUILD_NUMBER=$PUTIO_BETA_BUILD_NUMBER"
            echo "PUTIO_BETA_IPA_PATH=$PUTIO_BETA_IPA_PATH"
            echo "PUTIO_BETA_WAIT_TIMEOUT_DURATION=$PUTIO_BETA_WAIT_TIMEOUT_DURATION"
            echo "PUTIO_BETA_GROUPS=$PUTIO_BETA_GROUPS"
          } >> "$GITHUB_ENV"

      - name: Load shared release secrets
        uses: ./.github/actions/load-ios-release-secrets
        env:
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          PUTIO_APP_IDENTIFIER: ${{ secrets.PUTIO_APP_IDENTIFIER }}
          PUTIO_DEVELOPMENT_TEAM: ${{ secrets.PUTIO_DEVELOPMENT_TEAM }}
          PUTIO_OAUTH_CLIENT_ID: ${{ secrets.PUTIO_OAUTH_CLIENT_ID }}
          PUTIO_CHROMECAST_RECEIVER_APP_ID: ${{ secrets.PUTIO_CHROMECAST_RECEIVER_APP_ID }}
          PUTIO_INTERCOM_API_KEY: ${{ secrets.PUTIO_INTERCOM_API_KEY }}
          PUTIO_INTERCOM_APP_ID: ${{ secrets.PUTIO_INTERCOM_APP_ID }}
          PUTIO_SENTRY_DSN: ${{ secrets.PUTIO_SENTRY_DSN }}

      - name: Install the pinned asc
        run: |
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      - name: Install the App Store distribution identity
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          asc telemetry status --output json | jq -e '.enabled == false' > /dev/null
          ./scripts/install-signing.sh

      - name: Archive and export beta ipa
        env:
          PUTIO_APP_DISPLAY_NAME: put.io
          PUTIO_PRIMARY_APP_ICON: AppIconNightly
        run: |
          version="$(xcodebuild -workspace Putio.xcworkspace -scheme Putio -configuration Release -showBuildSettings -json \
            | jq -r '.[0].buildSettings.MARKETING_VERSION')"
          echo "PUTIO_BETA_APP_VERSION=$version" >> "$GITHUB_ENV"
          ./scripts/archive-ios.sh "$version" "$PUTIO_BETA_BUILD_NUMBER" "$PUTIO_BETA_IPA_PATH"

      - name: Upload and distribute to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
          PUTIO_BETA_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          asc telemetry status --output json | jq -e '.enabled == false' > /dev/null
          # --notify keeps pilot's default of emailing external testers.
          asc publish testflight --app 1260479699 --ipa "$PUTIO_BETA_IPA_PATH" \
            --group "$PUTIO_BETA_GROUPS" --test-notes "$PUTIO_BETA_NOTES" --locale en-US \
            --wait --timeout "${PUTIO_BETA_WAIT_TIMEOUT_DURATION}s" --notify --submit --confirm --output markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the signing keychain
        if: always() && env.PUTIO_SIGNING_KEYCHAIN != ''
        run: |
          [ ! -e "$PUTIO_SIGNING_KEYCHAIN" ] || asc signing keychain delete --keychain "$PUTIO_SIGNING_KEYCHAIN" --confirm --output json > /dev/null
