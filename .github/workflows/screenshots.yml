name: Screenshots

# The product page without a build: the committed screenshots, metadata, and
# version settings for one App Store version. Dispatch-only, and a dry run
# unless told otherwise; the images and text were reviewed as diffs before
# they landed, so this only moves them.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit SHA to upload from
        required: true
        type: string
      app_version:
        description: App Store version the listing attaches to, for example 3.0.0
        required: true
        type: string
      dry_run:
        description: Plan, validate, and stop before changing App Store Connect
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-store-${{ inputs.app_version }}
  cancel-in-progress: false

env:
  # Before any asc command: asc 5.15.0 sends command telemetry unless this is set.
  ASC_TELEMETRY_DISABLED: "1"
  ASC_SKILLS_AUTO_CHECK: "0"
  MISE_AUTO_INSTALL: "false"

# Explicit bash runs with -o pipefail, so asc failing in front of tee fails
# the step; GitHub's default shell does not.
defaults:
  run:
    shell: bash

jobs:
  validate-ref:
    name: Validate protected main
    uses: ./.github/workflows/delivery-ref.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}

  # No Xcode, no CocoaPods, no signing: Linux, asc, and the App Store Connect
  # key, nothing else from the release Environment.
  screenshots:
    name: Plan or apply the App Store listing
    needs: validate-ref
    runs-on: ubuntu-latest
    environment: release
    # --replace deletes a set before uploading it, so a job killed mid-set
    # leaves it empty. Generous, so asc fails on its own terms first.
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ inputs.app_version }}

    steps:
      # The concurrency key uses the raw input, so only the canonical form
      # may reach App Store Connect.
      - name: Check the version
        shell: bash
        run: |
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "App version must be three period-separated integers, for example 3.0.1" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
          cache: false

      - name: Install the pinned Node and asc
        run: |
          mise install node
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      # Read-only. The export holds App Store Connect's current metadata and
      # age-rating answers, ready to commit for the fields not managed yet.
      # Plan exports, then fails on a version App Store Connect won't edit.
      # age-rating.json is written last, so it marks a complete export.
      - name: Plan
        id: plan
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts plan --version "$APP_VERSION" --export build/app-store

      - name: Upload the current App Store Connect listing
        if: ${{ !cancelled() && hashFiles('build/app-store/age-rating.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-listing-${{ inputs.app_version }}
          path: build/app-store
          if-no-files-found: error
          retention-days: 14

      - name: Preview the screenshot replacement
        if: inputs.dry_run
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts screenshots --version "$APP_VERSION" --dry-run

      - name: Apply metadata and version settings
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts apply --version "$APP_VERSION" --confirm

      - name: Replace the screenshots
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts screenshots --version "$APP_VERSION" --confirm

      # After a failed apply or upload, not after a failed Plan: that already
      # reported why.
      - name: Validate submission readiness
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: mise exec -- node scripts/app-store.ts validate --version "$APP_VERSION"
