name: Next CI
run-name: Next app CI for ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - next
      - "next-rollout/**"
  push:
    branches:
      - next

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select affected lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes to next verify everything. Pull requests skip lanes whose platform
    # no changed path can affect; unlisted paths count for every lane.
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      ios: ${{ github.event_name == 'push' || steps.filter.outputs.ios == 'true' }}
      tvos: ${{ github.event_name == 'push' || steps.filter.outputs.tvos == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code: &code
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!skills-lock.json'
            ios:
              - *code
              - '!Apps/tvOS/**'
              - '!Tests/tvOS/**'
              - '!Tests/tvOSUITests/**'
            tvos:
              - *code
              - '!Apps/iOS/**'
              - '!Apps/watchOS/**'
              - '!Tests/iOS/**'
              - '!Tests/iOSUITests/**'

  # Five macOS jobs fill the organization's concurrent macOS limit, so a run
  # that overlaps another queues until slots free up.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple

      - name: Verify checks
        run: mise run verify checks

  tvos:
    name: tvOS tests
    needs: changes
    if: needs.changes.outputs.tvos == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: tvos

      - name: Verify tvOS snapshots and features
        run: mise run verify tvos

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-tvos-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-tvos-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: ios

      - name: Probe a cached template Simulator (experiment)
        run: |
          set -uo pipefail
          summ() { grep -oE "Status=[0-9]+, isTerminal=[A-Z]+, Elapsed=[0-9:]+" | awk -F', ' '{s=$1} s!=last {print; last=s}'; }
          devs="$HOME/Library/Developer/CoreSimulator/Devices"
          echo "service at job start: $(pgrep -lf CoreSimulatorService || echo none)"
          rt=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          dt=$(xcrun simctl list runtimes -j | jq -r --arg rt "$rt" '.runtimes[] | select(.identifier==$rt) | [.supportedDeviceTypes[] | select(.productFamily=="iPhone")][0].identifier')
          echo "runtime $rt device $dt"
          t=$(xcrun simctl create probe-template "$dt" "$rt")
          s=$SECONDS; xcrun simctl boot "$t"; xcrun simctl bootstatus "$t" -b -d | (summ || true); echo "template first boot: $((SECONDS-s))s"
          sleep 60; echo "load after 60s idle: $(sysctl -n vm.loadavg)"
          s=$SECONDS; xcrun simctl shutdown "$t"; echo "shutdown: $((SECONDS-s))s"
          du -sh "$devs/$t"
          s=$SECONDS; tar -cf "$RUNNER_TEMP/template.tar" -C "$devs" "$t" 2>&1 | tail -3; echo "tar exit ${PIPESTATUS[0]} in $((SECONDS-s))s"
          echo "tar bytes $(stat -f %z "$RUNNER_TEMP/template.tar")"
          zstd -q -T0 -3 "$RUNNER_TEMP/template.tar" -o "$RUNNER_TEMP/template.tar.zst" && echo "zstd bytes $(stat -f %z "$RUNNER_TEMP/template.tar.zst")"
          xcrun simctl delete "$t"
          s=$SECONDS; tar -xf "$RUNNER_TEMP/template.tar" -C "$devs" 2>&1 | tail -3; echo "untar in $((SECONDS-s))s"
          echo "visible after restore: $(xcrun simctl list devices | grep -c "$t")"
          if ! xcrun simctl list devices | grep -q "$t"; then
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null; sleep 3
            echo "visible after service restart: $(xcrun simctl list devices | grep -c "$t")"
          fi
          s=$SECONDS; c=$(xcrun simctl clone "$t" probe-clone); echo "clone in $((SECONDS-s))s: $c"
          s=$SECONDS; xcrun simctl boot "$c"; echo "simctl boot returned after $((SECONDS-s))s"
          xcrun simctl bootstatus "$c" -b -d > "$RUNNER_TEMP/clone-boot.log" 2>&1; echo "bootstatus exit $? after $((SECONDS-s))s"
          summ < "$RUNNER_TEMP/clone-boot.log" || true; tail -3 "$RUNNER_TEMP/clone-boot.log"
          sleep 20; echo "load 20s after clone boot: $(sysctl -n vm.loadavg)"
          sleep 40; echo "load 60s after clone boot: $(sysctl -n vm.loadavg)"
          xcrun simctl shutdown "$c"; xcrun simctl delete "$c" "$t"

      - name: Verify iOS snapshots and features
        run: mise run verify ios

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-ios-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ios-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  build:
    name: Builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: build

      - name: Build every app shell
        run: mise run verify build

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-build-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

  proof:
    name: iOS proof
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The proof builds the same Debug app as the build job, so it reuses
      # that job's compilation cache and saves none of its own.
      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: build

      - name: Exercise the headless Apple harness
        run: mise run harness-ci
