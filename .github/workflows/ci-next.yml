name: Next CI
run-name: Next app CI for ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - next
      - "next-rollout/**"
  push:
    branches:
      - next
  workflow_dispatch:
    inputs:
      verify:
        description: Run every macOS lane, as a push to next does. Off runs only links and the full-history scan.
        required: false
        default: false
        type: boolean

# Pull requests share a group per number so a new push cancels the stale run,
# and closing the pull request cancels it too; the push to next verifies a merged
# commit. Each push to next and each dispatch gets its own group, so every merged
# commit keeps its own result.
concurrency:
  group: next-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select affected lanes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes to next verify everything. Pull requests skip a lane when every
    # changed path is excluded from its filter; unlisted paths count for every
    # lane. Tooling runs on every pull request and push. This job also checks
    # Markdown links and scans each pushed range. A link or scan failure fails
    # this job without skipping the lanes, which use `!cancelled()`. A dispatch
    # runs only this job unless `verify` is set; only pushes save compilation
    # caches and Simulator templates.
    outputs:
      tooling: ${{ github.event_name != 'workflow_dispatch' || inputs.verify }}
      store: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.store == 'true' }}
      checks: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.checks == 'true' }}
      build: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.build == 'true' }}
      ios: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.ios == 'true' }}
      tvos: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.tvos == 'true' }}
      proof: ${{ github.event_name == 'push' || inputs.verify || steps.filter.outputs.proof == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            apple: &apple
              - '**'
              - '!**/*.md'
              - '!{docs,.agents,.claude,.github/ISSUE_TEMPLATE,Tests/Formal}/**'
              - '!{LICENSE,skills-lock.json,renovate.json,.worktreeinclude,.periphery.yml,.oxfmtrc.json,tsconfig.json,mise-tasks.toml}'
              - '!scripts/{bootstrap,dead-code,open,xcode-skills,install-asc}.sh'
              - '!scripts/{app-store,string-catalog,generate-design-tokens,formal-session}*.ts'
              - '!scripts/*.test.ts'
              - '!Config/AndroidStrings.json'
            checks:
              - *apple
              - '!scripts/{build,harness-ci}.sh'
              - '!Tests/HarnessMedia/**'
              - '!Tests/ComponentSnapshots/__Snapshots__/**'
            build:
              - *apple
              - '!scripts/{doctor,test,test-harness-interruption,harness-ci}.sh'
              - '!Tests/{iOS,iOSUITests,tvOS,tvOSUITests,ComponentSnapshots,Shared}/**'
            ios:
              - *apple
              - '!scripts/{doctor,test,test-harness-interruption,build,harness-ci}.sh'
              - '!Apps/tvOS/**'
              - '!Tests/{tvOS,tvOSUITests}/**'
              - '!Tests/ComponentSnapshots/__Snapshots__/tvos/**'
            tvos:
              - *apple
              - '!scripts/{doctor,test,test-harness-interruption,build,harness-ci}.sh'
              - '!Apps/{iOS,watchOS}/**'
              - '!Tests/{iOS,iOSUITests}/**'
              - '!Tests/ComponentSnapshots/__Snapshots__/ios/**'
            proof:
              - *apple
              - '!scripts/{doctor,test,test-harness-interruption,build}.sh'
              - '!Apps/tvOS/**'
              - '!Tests/{iOS,iOSUITests,tvOS,tvOSUITests,ComponentSnapshots,Shared}/**'
            # One pattern: predicate-quantifier every would require a file to
            # match every entry in a list.
            store:
              - '{scripts/app-store*.ts,scripts/install-asc.sh,.github/workflows/ci-next.yml}'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: putdotio/.github/.github/actions/links@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

      - name: Scan secrets and workflows
        if: ${{ !cancelled() }}
        uses: putdotio/.github/.github/actions/scan@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

  tooling:
    name: Tooling
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js and pnpm
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.5"
          install_args: node pnpm

      - name: Verify tooling
        run: ./scripts/verify.sh tooling

  # asc runs only here, on a fresh Linux runner: the pinned, checksummed binary
  # with telemetry off, then the store tool's tests against it, offline.
  app-store:
    name: App Store tooling
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.store == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ASC_TELEMETRY_DISABLED: "1"
      ASC_SKILLS_AUTO_CHECK: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js and pnpm
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.5"
          install_args: node pnpm

      - name: Install the pinned asc
        run: |
          ASC_INSTALL_DIR="$RUNNER_TEMP/asc/bin" ./scripts/install-asc.sh
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"

      # The second status runs without the variable, so the check fails if
      # telemetry was off for any other reason.
      - name: Prove asc telemetry is off
        run: |
          asc telemetry status --output json | jq -e '.enabled == false and .reason == "ASC_TELEMETRY_DISABLED"'
          env -u ASC_TELEMETRY_DISABLED asc telemetry status --output json | jq -e '.enabled == true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the store tool against asc
        env:
          PUTIO_REQUIRE_ASC: "1"
        run: |
          node --test scripts/app-store.test.ts
          if [ -s "$HOME/.asc/telemetry-spool.jsonl" ]; then
            echo "asc queued telemetry events" >&2
            exit 1
          fi

  # Five macOS jobs fill the organization's concurrent macOS limit, so a run
  # that overlaps another, a `verify` dispatch included, queues until slots
  # free up.
  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.checks == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple # zizmor: ignore[self-repository]

      - name: Verify checks
        run: ./scripts/verify.sh checks

  tvos:
    name: tvOS tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tvos == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple # zizmor: ignore[self-repository]
        with:
          lane: tvos

      - name: Verify tvOS snapshots and features
        run: ./scripts/verify.sh tvos

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-tvos-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-tvos-attempt-${{ github.run_attempt }}
          path: |
            build/DerivedData/Logs/Test/*.xcresult
            build/snapshot-failures/
          if-no-files-found: ignore
          retention-days: 5

  ios:
    name: iOS tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        id: setup
        uses: ./.github/actions/setup-apple # zizmor: ignore[self-repository]
        with:
          lane: ios
          simulator-template: true

      - name: Verify iOS snapshots and features
        run: ./scripts/verify.sh ios

      - name: Stage a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        run: |
          mkdir -p ~/.cache/putio-simulator-templates
          xcrun simctl list devices -j \
            | jq -r '.devices[][] | select(.name | startswith("putio-template-")) | .udid' \
            | while read -r udid; do
                ditto "$HOME/Library/Developer/CoreSimulator/Devices/$udid" "$HOME/.cache/putio-simulator-templates/$udid"
              done

      - name: Save a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/putio-simulator-templates
          key: ${{ steps.setup.outputs.simulator-template-key }}

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-ios-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-ios-attempt-${{ github.run_attempt }}
          path: |
            build/DerivedData/Logs/Test/*.xcresult
            build/snapshot-failures/
          if-no-files-found: ignore
          retention-days: 5

  build:
    name: Builds
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple # zizmor: ignore[self-repository]
        with:
          lane: build

      - name: Build every app shell in Release
        run: ./scripts/verify.sh build

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-build-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

  proof:
    name: iOS proof
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.proof == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        id: setup
        uses: ./.github/actions/setup-apple # zizmor: ignore[self-repository]
        with:
          lane: proof
          simulator-template: true

      - name: Exercise the headless Apple harness
        run: ./scripts/harness-ci.sh

      - name: Stage a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        run: |
          mkdir -p ~/.cache/putio-simulator-templates
          xcrun simctl list devices -j \
            | jq -r '.devices[][] | select(.name | startswith("putio-template-")) | .udid' \
            | while read -r udid; do
                ditto "$HOME/Library/Developer/CoreSimulator/Devices/$udid" "$HOME/.cache/putio-simulator-templates/$udid"
              done

      - name: Save a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/putio-simulator-templates
          key: ${{ steps.setup.outputs.simulator-template-key }}

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-proof-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}
