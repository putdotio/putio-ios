name: Next CI
run-name: Next app CI for ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - next
      - "next-rollout/**"
  push:
    branches:
      - next

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select affected lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes to next verify everything. Pull requests skip lanes whose platform
    # no changed path can affect; unlisted paths count for every lane.
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      ios: ${{ github.event_name == 'push' || steps.filter.outputs.ios == 'true' }}
      tvos: ${{ github.event_name == 'push' || steps.filter.outputs.tvos == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code: &code
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!skills-lock.json'
            ios:
              - *code
              - '!Apps/tvOS/**'
              - '!Tests/tvOS/**'
              - '!Tests/tvOSUITests/**'
            tvos:
              - *code
              - '!Apps/iOS/**'
              - '!Apps/watchOS/**'
              - '!Tests/iOS/**'
              - '!Tests/iOSUITests/**'

  checks:
    name: Checks and tvOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: checks

      - name: Verify checks and tvOS snapshots
        run: mise run verify checks ${{ needs.changes.outputs.tvos == 'true' && 'tvos' || '' }}

      - name: Save Xcode compilation cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-checks-${{ github.sha }}

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-checks-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: ios

      - name: Verify iOS snapshots and features
        run: mise run verify ios

      - name: Save Xcode compilation cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-ios-${{ github.sha }}

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ios-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  build:
    name: Builds and iOS proof
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: build

      - name: Build every app shell
        run: mise run verify build

      - name: Exercise the headless Apple harness
        if: needs.changes.outputs.ios == 'true'
        run: mise run harness-ci

      - name: Save Xcode compilation cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-build-${{ github.sha }}
