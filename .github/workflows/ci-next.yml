name: Next CI
run-name: Next app CI for ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - next
      - "next-rollout/**"
  push:
    branches:
      - next

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select affected lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes to next verify everything. Pull requests skip lanes whose platform
    # no changed path can affect; unlisted paths count for every lane. The
    # checks lane also checks Markdown; the Markdown job covers pull requests
    # that change Markdown, including the docs-only ones that skip every lane.
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      ios: ${{ github.event_name == 'push' || steps.filter.outputs.ios == 'true' }}
      tvos: ${{ github.event_name == 'push' || steps.filter.outputs.tvos == 'true' }}
      markdown: ${{ github.event_name == 'pull_request' && steps.filter.outputs.markdown == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code: &code
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!skills-lock.json'
            ios:
              - *code
              - '!Apps/tvOS/**'
              - '!Tests/tvOS/**'
              - '!Tests/tvOSUITests/**'
            tvos:
              - *code
              - '!Apps/iOS/**'
              - '!Apps/watchOS/**'
              - '!Tests/iOS/**'
              - '!Tests/iOSUITests/**'
            markdown:
              - '**/*.md'

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js and pnpm
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.9.15"
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Markdown formatting
        run: pnpm run markdown:check

  # Five macOS jobs fill the organization's concurrent macOS limit, so a run
  # that overlaps another queues until slots free up.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple

      - name: Verify checks
        run: mise run verify checks

  tvos:
    name: tvOS tests
    needs: changes
    if: needs.changes.outputs.tvos == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: tvos

      - name: Verify tvOS snapshots and features
        run: mise run verify tvos

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-tvos-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-tvos-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        id: setup
        uses: ./.github/actions/setup-apple
        with:
          lane: ios
          simulator-template: true

      - name: Verify iOS snapshots and features
        run: mise run verify ios

      - name: Stage a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        run: |
          mkdir -p ~/.cache/putio-simulator-templates
          xcrun simctl list devices -j \
            | jq -r '.devices[][] | select(.name | startswith("putio-template-")) | .udid' \
            | while read -r udid; do
                ditto "$HOME/Library/Developer/CoreSimulator/Devices/$udid" "$HOME/.cache/putio-simulator-templates/$udid"
              done

      - name: Save a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/putio-simulator-templates
          key: ${{ steps.setup.outputs.simulator-template-key }}

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-ios-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ios-attempt-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 5

  build:
    name: Builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Apple toolchain
        uses: ./.github/actions/setup-apple
        with:
          lane: build

      - name: Build every app shell
        run: mise run verify build

      - name: Save Xcode compilation cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-xcode-cas-build-${{ env.PUTIO_CAS_WEEK }}-${{ github.sha }}

  proof:
    name: iOS proof
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The proof builds the same Debug app as the build job, so it reuses
      # that job's compilation cache and saves none of its own.
      - name: Set up the Apple toolchain
        id: setup
        uses: ./.github/actions/setup-apple
        with:
          lane: build
          simulator-template: true

      - name: Exercise the headless Apple harness
        run: mise run harness-ci

      - name: Stage a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        run: |
          mkdir -p ~/.cache/putio-simulator-templates
          xcrun simctl list devices -j \
            | jq -r '.devices[][] | select(.name | startswith("putio-template-")) | .udid' \
            | while read -r udid; do
                ditto "$HOME/Library/Developer/CoreSimulator/Devices/$udid" "$HOME/.cache/putio-simulator-templates/$udid"
              done

      - name: Save a new iOS Simulator template
        if: success() && github.event_name == 'push' && steps.setup.outputs.simulator-template-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/putio-simulator-templates
          key: ${{ steps.setup.outputs.simulator-template-key }}
