[tools]
node = "24.19.0"
pnpm = "12.0.0"
tuist = "4.203.4"

[tasks.doctor]
description = "Validate the local Apple development toolchain"
run = "./scripts/doctor.sh"

[tasks.bootstrap]
description = "Generate the workspace and verify the provisioned host"
run = "./scripts/bootstrap.sh"

[tasks.generate]
description = "Generate the Xcode workspace without opening Xcode"
run = "./scripts/generate.sh"

[tasks.tokens]
description = "Regenerate the Swift design-token adapter"
run = "pnpm run tokens:generate"

[tasks.fonts-setup]
description = "Download the checksummed licensed brand fonts"
run = "pnpm run fonts:setup"

[tasks.verify-fonts]
description = "Verify the local brand fonts against the manifest"
run = "pnpm run fonts:check"

[tasks.test]
description = "Format-check and test the shared core"
run = "./scripts/test.sh"

[tasks.build]
description = "Build every Apple app shell"
depends = ["generate"]
run = "./scripts/build.sh"

[tasks.open]
description = "Generate and open the Xcode workspace"
run = "./scripts/open.sh"

[tasks.harness]
description = "Run the typed headless Apple-platform harness"
run = "./scripts/harness.sh"

[tasks.harness-ci]
description = "Run the headless iOS proof subset used by CI"
run = "./scripts/harness-ci.sh"

[tasks.verify]
description = "Test the shared core and build every Apple app shell"
run = "./scripts/verify.sh"
